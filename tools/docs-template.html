<!doctype html>
<html lang="fa" dir="rtl" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="پرتال آفلاین مستندات پروژه لغت‌نامه، Laravel API و Android Native">
  <title>مرکز مستندات پروژه</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('docs-portal:theme');
        if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'system');
      }
    }());
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-soft: #eef2f8;
      --surface-accent: #e8f1ff;
      --text: #172033;
      --text-soft: #536078;
      --text-faint: #738097;
      --border: #dce2ec;
      --border-strong: #c7d0df;
      --accent: #1f63d6;
      --accent-hover: #174da7;
      --accent-text: #ffffff;
      --focus: #f59e0b;
      --success: #14784b;
      --success-bg: #e6f6ee;
      --warning: #986207;
      --warning-bg: #fff4d6;
      --danger: #b32937;
      --danger-bg: #fdebed;
      --info: #285da8;
      --info-bg: #e8f1ff;
      --code-bg: #182235;
      --code-text: #edf3ff;
      --mark: #ffe59b;
      --mark-text: #352500;
      --overlay: rgba(16, 24, 40, 0.5);
      --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.07);
      --shadow-md: 0 12px 35px rgba(17, 24, 39, 0.14);
      --header-height: 4rem;
      --docs-width: 18rem;
      --toc-width: 15.5rem;
      --content-width: 54rem;
      --radius-sm: 0.55rem;
      --radius-md: 0.85rem;
      --radius-lg: 1.15rem;
      --font-fa: Vazirmatn, Tahoma, "Segoe UI", Arial, sans-serif;
      --font-en: "Segoe UI", Arial, sans-serif;
      --mono: "Cascadia Code", Consolas, "Courier New", monospace;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1623;
      --surface: #161f2f;
      --surface-raised: #1b2638;
      --surface-soft: #202c3f;
      --surface-accent: #172d4e;
      --text: #edf2fa;
      --text-soft: #b8c2d2;
      --text-faint: #929eb2;
      --border: #2d3a4e;
      --border-strong: #415069;
      --accent: #78aafc;
      --accent-hover: #a5c6ff;
      --accent-text: #0c1b31;
      --focus: #fbbf24;
      --success: #72d5aa;
      --success-bg: #14382d;
      --warning: #f2c568;
      --warning-bg: #3c2d13;
      --danger: #ff9ca7;
      --danger-bg: #411f28;
      --info: #9cc2ff;
      --info-bg: #172d4e;
      --code-bg: #0b111d;
      --code-text: #eef4ff;
      --mark: #705719;
      --mark-text: #fff4cf;
      --overlay: rgba(0, 0, 0, 0.68);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.26);
      --shadow-md: 0 15px 42px rgba(0, 0, 0, 0.4);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0f1623;
        --surface: #161f2f;
        --surface-raised: #1b2638;
        --surface-soft: #202c3f;
        --surface-accent: #172d4e;
        --text: #edf2fa;
        --text-soft: #b8c2d2;
        --text-faint: #929eb2;
        --border: #2d3a4e;
        --border-strong: #415069;
        --accent: #78aafc;
        --accent-hover: #a5c6ff;
        --accent-text: #0c1b31;
        --focus: #fbbf24;
        --success: #72d5aa;
        --success-bg: #14382d;
        --warning: #f2c568;
        --warning-bg: #3c2d13;
        --danger: #ff9ca7;
        --danger-bg: #411f28;
        --info: #9cc2ff;
        --info-bg: #172d4e;
        --code-bg: #0b111d;
        --code-text: #eef4ff;
        --mark: #705719;
        --mark-text: #fff4cf;
        --overlay: rgba(0, 0, 0, 0.68);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.26);
        --shadow-md: 0 15px 42px rgba(0, 0, 0, 0.4);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 20rem;
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-height) + 1rem);
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-wrap: anywhere;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-fa);
      font-size: 1rem;
      line-height: 1.75;
      text-align: start;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button,
    summary,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    a:hover {
      color: var(--accent-hover);
    }

    :focus-visible {
      outline: 0.2rem solid var(--focus);
      outline-offset: 0.18rem;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .skip-link {
      position: fixed;
      z-index: 1000;
      inset-block-start: 0.5rem;
      inset-inline-start: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: var(--radius-sm);
      background: var(--text);
      color: var(--surface);
      font-weight: 700;
      transform: translateY(-160%);
      transition: transform 140ms ease;
    }

    .skip-link:focus {
      color: var(--surface);
      transform: translateY(0);
    }

    .app-header {
      position: sticky;
      z-index: 80;
      inset-block-start: 0;
      display: flex;
      min-height: var(--header-height);
      align-items: center;
      gap: 1rem;
      padding: 0.55rem 1rem;
      border-block-end: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      min-width: 14.5rem;
      align-items: center;
      gap: 0.7rem;
      color: var(--text);
      text-decoration: none;
    }

    .brand:hover {
      color: var(--text);
    }

    .brand-mark {
      display: grid;
      width: 2.5rem;
      height: 2.5rem;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 0.8rem;
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: var(--shadow-sm);
    }

    .brand-mark svg,
    .icon-button svg,
    .button svg,
    .search-trigger svg,
    .search-result-icon svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .brand-copy {
      display: grid;
      line-height: 1.25;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 800;
    }

    .brand-subtitle {
      color: var(--text-soft);
      font-size: 0.73rem;
    }

    .header-search {
      display: flex;
      min-width: 12rem;
      max-width: 37rem;
      flex: 1 1 30rem;
      justify-content: center;
    }

    .search-trigger {
      display: flex;
      width: min(100%, 36rem);
      min-height: 2.65rem;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid var(--border-strong);
      border-radius: 0.75rem;
      background: var(--surface-soft);
      color: var(--text-soft);
      cursor: pointer;
      text-align: start;
    }

    .search-trigger:hover {
      border-color: var(--accent);
      background: var(--surface-accent);
      color: var(--text);
    }

    .search-trigger-label {
      flex: 1;
    }

    kbd {
      direction: ltr;
      unicode-bidi: isolate;
      padding: 0.06rem 0.38rem;
      border: 1px solid var(--border-strong);
      border-block-end-width: 2px;
      border-radius: 0.35rem;
      background: var(--surface);
      color: var(--text-soft);
      font-family: var(--font-en);
      font-size: 0.72rem;
      line-height: 1.55;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.35rem;
    }

    .icon-button,
    .button {
      display: inline-flex;
      min-height: 2.65rem;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
    }

    .icon-button {
      width: 2.65rem;
      padding: 0;
    }

    .button {
      padding: 0.52rem 0.82rem;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .button-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    .button-primary:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
      color: var(--accent-text);
    }

    .icon-button:hover,
    .button:not(.button-primary):hover {
      border-color: var(--border-strong);
      background: var(--surface-soft);
      color: var(--accent-hover);
    }

    .icon-button:disabled,
    .button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .mobile-only {
      display: none;
    }

    .theme-picker {
      position: relative;
    }

    .theme-picker > summary {
      list-style: none;
    }

    .theme-picker > summary::-webkit-details-marker {
      display: none;
    }

    .theme-menu {
      position: absolute;
      z-index: 120;
      inset-block-start: calc(100% + 0.5rem);
      inset-inline-end: 0;
      display: grid;
      width: 12.5rem;
      gap: 0.3rem;
      padding: 0.45rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-raised);
      box-shadow: var(--shadow-md);
    }

    .theme-option {
      display: flex;
      width: 100%;
      min-height: 2.5rem;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.45rem 0.65rem;
      border-radius: 0.55rem;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: start;
    }

    .theme-option:hover,
    .theme-option[aria-pressed="true"] {
      background: var(--surface-accent);
      color: var(--accent-hover);
    }

    .theme-option[aria-pressed="true"]::after {
      content: "✓";
      color: var(--success);
      font-weight: 900;
    }

    .reading-progress-track {
      position: fixed;
      z-index: 90;
      inset-block-start: calc(var(--header-height) - 0.18rem);
      inset-inline: 0;
      height: 0.18rem;
      pointer-events: none;
    }

    .reading-progress-bar {
      width: 0;
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 0.45rem color-mix(in srgb, var(--accent) 50%, transparent);
      transition: width 100ms linear;
    }

    .app-layout {
      display: flex;
      min-height: calc(100vh - var(--header-height));
      align-items: stretch;
    }

    .docs-panel,
    .toc-panel {
      position: sticky;
      z-index: 30;
      inset-block-start: var(--header-height);
      height: calc(100vh - var(--header-height));
      flex: 0 0 auto;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      scrollbar-width: thin;
    }

    .docs-panel {
      width: var(--docs-width);
      border-inline-end: 1px solid var(--border);
    }

    .toc-panel {
      width: var(--toc-width);
      border-inline-start: 1px solid var(--border);
    }

    .panel-header {
      display: flex;
      min-height: 3.5rem;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-block-end: 1px solid var(--border);
      background: var(--surface);
    }

    .panel-title {
      margin: 0;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .panel-body {
      padding: 0.8rem;
    }

    .nav-home {
      display: flex;
      min-height: 2.65rem;
      align-items: center;
      gap: 0.6rem;
      margin-block-end: 0.45rem;
      padding: 0.5rem 0.7rem;
      border-radius: 0.6rem;
      color: var(--text);
      font-weight: 750;
      text-decoration: none;
    }

    .nav-home:hover,
    .nav-home[aria-current="page"] {
      background: var(--surface-accent);
      color: var(--accent-hover);
    }

    .nav-home-symbol {
      width: 1.35rem;
      flex: 0 0 auto;
      color: var(--accent);
      text-align: center;
    }

    .nav-group {
      margin-block: 0.35rem;
      border-radius: 0.65rem;
    }

    .nav-group > summary {
      display: flex;
      min-height: 2.5rem;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.65rem;
      border-radius: 0.55rem;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 800;
      list-style: none;
      user-select: none;
    }

    .nav-group > summary::-webkit-details-marker {
      display: none;
    }

    .nav-group > summary::before {
      content: "‹";
      color: var(--text-faint);
      font-size: 1.2rem;
      line-height: 1;
      transform: rotate(0deg);
      transition: transform 140ms ease;
    }

    .nav-group[open] > summary::before {
      transform: rotate(-90deg);
    }

    .nav-group > summary:hover {
      background: var(--surface-soft);
      color: var(--text);
    }

    .nav-count {
      min-width: 1.55rem;
      margin-inline-start: auto;
      padding: 0 0.35rem;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text-faint);
      font-family: var(--font-en);
      font-size: 0.68rem;
      line-height: 1.55rem;
      text-align: center;
    }

    .nav-doc-list {
      display: grid;
      gap: 0.14rem;
      margin: 0;
      padding: 0.15rem 0.4rem 0.5rem 0;
      list-style: none;
    }

    .nav-doc-link {
      display: block;
      padding: 0.42rem 0.7rem;
      border-inline-start: 0.2rem solid transparent;
      border-radius: 0.4rem;
      color: var(--text-soft);
      font-size: 0.8rem;
      line-height: 1.55;
      text-decoration: none;
    }

    .nav-doc-link:hover {
      background: var(--surface-soft);
      color: var(--text);
    }

    .nav-doc-link[aria-current="page"] {
      border-inline-start-color: var(--accent);
      background: var(--surface-accent);
      color: var(--accent-hover);
      font-weight: 750;
    }

    .panel-footer {
      margin: 0.4rem 0.8rem 1rem;
      padding: 0.7rem;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      background: var(--surface-soft);
      color: var(--text-faint);
      font-size: 0.72rem;
    }

    .main-content {
      min-width: 0;
      flex: 1 1 auto;
      padding: 2rem clamp(1rem, 3vw, 2.7rem) 4rem;
    }

    .view-shell {
      width: min(100%, var(--content-width));
      margin-inline: auto;
    }

    .home-hero {
      position: relative;
      overflow: hidden;
      margin-block-end: 1.4rem;
      padding: clamp(1.35rem, 4vw, 2.7rem);
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
      border-radius: var(--radius-lg);
      background:
        radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 35%),
        linear-gradient(135deg, var(--surface), var(--surface-accent));
      box-shadow: var(--shadow-sm);
    }

    .home-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-block-end: 0.75rem;
      padding: 0.2rem 0.55rem;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
      border-radius: 999px;
      background: var(--surface);
      color: var(--accent-hover);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .home-hero h1 {
      max-width: 17ch;
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.8rem);
      line-height: 1.35;
      letter-spacing: -0.025em;
    }

    .home-hero p {
      max-width: 62ch;
      margin: 0.75rem 0 0;
      color: var(--text-soft);
      font-size: clamp(0.95rem, 2vw, 1.08rem);
    }

    .home-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-block-start: 1.25rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.8rem;
      margin-block: 1.2rem;
    }

    .metric-card {
      min-width: 0;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .metric-label {
      display: block;
      color: var(--text-faint);
      font-size: 0.74rem;
      font-weight: 700;
    }

    .metric-value {
      display: block;
      margin-block-start: 0.22rem;
      font-family: var(--font-en);
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      font-weight: 850;
      line-height: 1.25;
    }

    .metric-value.success { color: var(--success); }
    .metric-value.warning { color: var(--warning); }
    .metric-value.danger { color: var(--danger); }
    .metric-value.info { color: var(--info); }

    .dashboard-section {
      margin-block-start: 1.7rem;
    }

    .section-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-block-end: 0.8rem;
    }

    .section-heading-row h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .section-hint {
      color: var(--text-faint);
      font-size: 0.78rem;
    }

    .project-status-card,
    .continue-card {
      display: grid;
      gap: 0.65rem;
      padding: 1.1rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .project-status-card {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
    }

    .project-status-card h2,
    .continue-card h2 {
      margin: 0;
      font-size: 1rem;
    }

    .project-status-card p,
    .continue-card p {
      margin: 0.25rem 0 0;
      color: var(--text-soft);
      font-size: 0.86rem;
    }

    .continue-card {
      margin-block-start: 0.8rem;
      border-inline-start: 0.26rem solid var(--accent);
    }

    .continue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .mini-progress {
      height: 0.38rem;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .mini-progress > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .group-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }

    .group-card {
      min-width: 0;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .group-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-block-end: 0.55rem;
    }

    .group-card h3 {
      margin: 0;
      font-size: 0.96rem;
    }

    .group-card-count {
      padding: 0.08rem 0.5rem;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text-faint);
      font-family: var(--font-en);
      font-size: 0.7rem;
    }

    .group-docs {
      display: grid;
      gap: 0.2rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .group-docs a {
      display: block;
      padding: 0.35rem 0.45rem;
      border-radius: 0.4rem;
      color: var(--text-soft);
      font-size: 0.82rem;
      text-decoration: none;
    }

    .group-docs a:hover {
      background: var(--surface-soft);
      color: var(--accent-hover);
    }

    .reading-surface {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .document-header {
      padding: clamp(1.25rem, 4vw, 2.4rem);
      border-block-end: 1px solid var(--border);
      background: linear-gradient(150deg, var(--surface), color-mix(in srgb, var(--surface-accent) 46%, var(--surface)));
      border-start-start-radius: inherit;
      border-start-end-radius: inherit;
    }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin-block-end: 0.8rem;
      color: var(--text-faint);
      font-size: 0.76rem;
    }

    .breadcrumbs a {
      color: var(--text-soft);
      text-decoration: none;
    }

    .breadcrumbs a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .document-title {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      line-height: 1.42;
      letter-spacing: -0.018em;
    }

    .document-summary {
      max-width: 68ch;
      margin: 0.75rem 0 0;
      color: var(--text-soft);
      font-size: 0.95rem;
      line-height: 1.9;
    }

    .document-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
      margin-block-start: 1rem;
    }

    .meta-chip,
    .status-chip {
      display: inline-flex;
      min-height: 1.8rem;
      align-items: center;
      gap: 0.32rem;
      padding: 0.17rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-soft);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .lifecycle-chip-canonical {
      border-color: color-mix(in srgb, var(--success) 38%, var(--border));
      background: var(--success-bg);
      color: var(--success);
      font-weight: 800;
    }

    .lifecycle-chip-legacy {
      border-color: color-mix(in srgb, var(--warning) 38%, var(--border));
      background: var(--warning-bg);
      color: var(--warning);
      font-weight: 800;
    }

    .document-notice,
    .lifecycle-overview {
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      border-inline-start: 0.22rem solid var(--warning);
      border-radius: 0.55rem;
      background: var(--warning-bg);
      color: var(--text-soft);
      font-size: 0.78rem;
      line-height: 1.75;
    }

    .document-notice {
      margin-block-start: 0.9rem;
    }

    .document-notice-canonical {
      border-inline-start-color: var(--success);
      background: var(--success-bg);
    }

    .lifecycle-overview {
      margin-block-start: 0.8rem;
    }

    .lifecycle-overview strong {
      color: var(--text);
    }

    .document-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-block-start: 1.1rem;
    }

    .document-path {
      direction: ltr;
      unicode-bidi: isolate;
      font-family: var(--mono);
      font-size: 0.68rem;
    }

    .document-body {
      padding: clamp(1.2rem, 4vw, 2.5rem);
      font-size: 1rem;
      line-height: 1.95;
    }

    .document-body[dir="ltr"] {
      font-family: var(--font-en);
      line-height: 1.78;
    }

    .document-body > :first-child {
      margin-block-start: 0;
    }

    .document-body > :last-child {
      margin-block-end: 0;
    }

    .document-body h1,
    .document-body h2,
    .document-body h3,
    .document-body h4,
    .document-body h5,
    .document-body h6 {
      position: relative;
      scroll-margin-top: calc(var(--header-height) + 1rem);
      color: var(--text);
      line-height: 1.5;
      text-wrap: balance;
    }

    .document-body h1 { margin: 2.25rem 0 1rem; font-size: 1.75rem; }
    .document-body h2 { margin: 2.15rem 0 0.85rem; padding-block-end: 0.38rem; border-block-end: 1px solid var(--border); font-size: 1.42rem; }
    .document-body h3 { margin: 1.85rem 0 0.7rem; font-size: 1.18rem; }
    .document-body h4 { margin: 1.55rem 0 0.6rem; font-size: 1.03rem; }
    .document-body h5,
    .document-body h6 { margin: 1.35rem 0 0.5rem; font-size: 0.95rem; }

    .heading-anchor {
      position: absolute;
      inset-inline-start: -1.4rem;
      inset-block-start: 0.1em;
      padding: 0.1rem 0.35rem;
      color: var(--text-faint);
      font-family: var(--font-en);
      font-size: 0.75em;
      opacity: 0;
      text-decoration: none;
      transition: opacity 120ms ease;
    }

    .document-body :is(h1, h2, h3, h4, h5, h6):hover .heading-anchor,
    .heading-anchor:focus-visible {
      opacity: 1;
    }

    .document-body p {
      margin: 0.78rem 0;
    }

    .document-body ul,
    .document-body ol {
      margin: 0.75rem 0;
      padding-inline-start: 1.45rem;
    }

    .document-body li {
      margin-block: 0.25rem;
    }

    .document-body li::marker {
      color: var(--accent);
      font-weight: 700;
    }

    .document-body blockquote {
      margin: 1rem 0;
      padding: 0.7rem 1rem;
      border-inline-start: 0.25rem solid var(--accent);
      border-radius: 0.4rem;
      background: var(--surface-soft);
      color: var(--text-soft);
    }

    .document-body blockquote > :first-child { margin-block-start: 0; }
    .document-body blockquote > :last-child { margin-block-end: 0; }

    .document-body hr {
      margin: 2rem 0;
      border: 0;
      border-block-start: 1px solid var(--border);
    }

    .document-body img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1rem auto;
      border-radius: 0.55rem;
    }

    .document-body code,
    .document-body pre,
    .document-body samp {
      direction: ltr;
      unicode-bidi: isolate;
      font-family: var(--mono);
      text-align: left;
    }

    .document-body :not(pre) > code {
      padding: 0.12em 0.36em;
      border: 1px solid var(--border);
      border-radius: 0.32rem;
      background: var(--surface-soft);
      color: var(--danger);
      font-size: 0.86em;
      white-space: break-spaces;
    }

    .document-body pre {
      max-width: 100%;
      margin: 1rem 0;
      overflow: auto;
      padding: 1rem;
      border: 1px solid color-mix(in srgb, var(--code-bg) 80%, var(--border));
      border-radius: 0.7rem;
      background: var(--code-bg);
      color: var(--code-text);
      font-size: 0.82rem;
      line-height: 1.65;
      scrollbar-width: thin;
    }

    .document-body pre code {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: inherit;
      white-space: pre;
    }

    .table-scroll {
      max-width: 100%;
      margin: 1.05rem 0;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      scrollbar-width: thin;
    }

    .document-body table {
      width: 100%;
      min-width: 34rem;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 0.82rem;
      line-height: 1.7;
    }

    .document-body th,
    .document-body td {
      padding: 0.58rem 0.72rem;
      border-block-end: 1px solid var(--border);
      border-inline-end: 1px solid var(--border);
      vertical-align: top;
      text-align: start;
    }

    .document-body th:last-child,
    .document-body td:last-child {
      border-inline-end: 0;
    }

    .document-body tr:last-child td {
      border-block-end: 0;
    }

    .document-body thead th {
      background: var(--surface-soft);
      color: var(--text);
      font-weight: 800;
    }

    .document-body tbody tr:nth-child(even) {
      background: color-mix(in srgb, var(--surface-soft) 45%, var(--surface));
    }

    .document-body .status-done,
    .status-done {
      color: var(--success);
      font-weight: 800;
    }

    .document-body .status-blocked,
    .status-blocked {
      color: var(--danger);
      font-weight: 800;
    }

    .document-body .status-progress,
    .status-progress {
      color: var(--warning);
      font-weight: 800;
    }

    .document-body a.external-link::after {
      content: "↗";
      display: inline-block;
      margin-inline-start: 0.16em;
      font-family: var(--font-en);
      font-size: 0.72em;
      text-decoration: none;
    }

    .document-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem clamp(1.2rem, 4vw, 2.5rem);
      border-block-start: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 0.75rem;
    }

    .document-footer code {
      direction: ltr;
      unicode-bidi: isolate;
      font-family: var(--mono);
    }

    .toc-list {
      display: grid;
      gap: 0.18rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .toc-link {
      display: block;
      padding: 0.36rem 0.55rem;
      border-inline-start: 0.15rem solid transparent;
      border-radius: 0.35rem;
      color: var(--text-soft);
      font-size: 0.76rem;
      line-height: 1.55;
      text-decoration: none;
    }

    .toc-link:hover {
      background: var(--surface-soft);
      color: var(--text);
    }

    .toc-link[aria-current="location"] {
      border-inline-start-color: var(--accent);
      background: var(--surface-accent);
      color: var(--accent-hover);
      font-weight: 750;
    }

    .toc-link[data-level="3"] { padding-inline-start: 1.1rem; }
    .toc-link[data-level="4"] { padding-inline-start: 1.65rem; font-size: 0.72rem; }
    .toc-link[data-level="5"],
    .toc-link[data-level="6"] { padding-inline-start: 2.1rem; font-size: 0.7rem; }

    .toc-empty,
    .empty-state {
      padding: 1rem;
      color: var(--text-faint);
      font-size: 0.8rem;
      text-align: center;
    }

    .not-found,
    .fatal-error {
      padding: clamp(1.4rem, 5vw, 3rem);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      text-align: center;
    }

    .not-found h1,
    .fatal-error h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .not-found p,
    .fatal-error p {
      color: var(--text-soft);
    }

    .fatal-details {
      direction: ltr;
      max-width: 100%;
      margin: 1rem 0;
      overflow: auto;
      padding: 0.75rem;
      border-radius: 0.55rem;
      background: var(--code-bg);
      color: var(--code-text);
      font-family: var(--mono);
      font-size: 0.75rem;
      text-align: left;
      white-space: pre-wrap;
    }

    .drawer-overlay {
      position: fixed;
      z-index: 55;
      inset: var(--header-height) 0 0;
      display: none;
      background: var(--overlay);
      opacity: 0;
      transition: opacity 150ms ease;
    }

    .search-dialog {
      width: min(44rem, calc(100vw - 2rem));
      max-height: min(43rem, calc(100vh - 2rem));
      margin: max(1rem, 8vh) auto auto;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: var(--surface-raised);
      color: var(--text);
      box-shadow: var(--shadow-md);
    }

    .search-dialog::backdrop {
      background: var(--overlay);
      backdrop-filter: blur(2px);
    }

    .search-dialog[open] {
      display: flex;
      flex-direction: column;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.75rem;
      border-block-end: 1px solid var(--border);
    }

    .search-input-wrap {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 0.55rem;
      padding: 0.2rem 0.65rem;
      border: 1px solid var(--border-strong);
      border-radius: 0.7rem;
      background: var(--surface-soft);
    }

    .search-input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.18rem color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .search-input-wrap svg {
      width: 1.15rem;
      height: 1.15rem;
      flex: 0 0 auto;
      fill: none;
      stroke: var(--text-faint);
      stroke-linecap: round;
      stroke-width: 1.8;
    }

    .search-input {
      width: 100%;
      min-height: 2.5rem;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .search-input::placeholder {
      color: var(--text-faint);
    }

    .search-filters {
      display: flex;
      gap: 0.4rem;
      padding: 0.65rem 0.8rem;
      overflow-x: auto;
      border-block-end: 1px solid var(--border);
      scrollbar-width: thin;
    }

    .filter-chip {
      min-height: 2rem;
      flex: 0 0 auto;
      padding: 0.25rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-soft);
      cursor: pointer;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .filter-chip:hover,
    .filter-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--surface-accent);
      color: var(--accent-hover);
    }

    .search-summary {
      min-height: 2.25rem;
      padding: 0.45rem 0.9rem;
      color: var(--text-faint);
      font-size: 0.72rem;
    }

    .search-results {
      min-height: 8rem;
      flex: 1 1 auto;
      margin: 0;
      overflow: auto;
      padding: 0 0.55rem 0.65rem;
      list-style: none;
      overscroll-behavior: contain;
    }

    .search-result-link {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.7rem;
      padding: 0.7rem;
      border-radius: 0.65rem;
      color: var(--text);
      text-decoration: none;
    }

    .search-result-link:hover,
    .search-result-link:focus-visible {
      background: var(--surface-accent);
      color: var(--text);
    }

    .search-result-icon {
      display: grid;
      width: 2rem;
      height: 2rem;
      place-items: center;
      border-radius: 0.55rem;
      background: var(--surface-soft);
      color: var(--accent);
    }

    .search-result-main {
      min-width: 0;
    }

    .search-result-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.7rem;
    }

    .search-result-title {
      font-size: 0.88rem;
      font-weight: 800;
    }

    .search-result-group {
      flex: 0 0 auto;
      color: var(--text-faint);
      font-size: 0.66rem;
    }

    .search-result-heading {
      display: block;
      color: var(--accent-hover);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .search-result-snippet {
      display: -webkit-box;
      margin: 0.15rem 0 0;
      overflow: hidden;
      color: var(--text-soft);
      font-size: 0.74rem;
      line-height: 1.65;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    mark {
      border-radius: 0.15rem;
      background: var(--mark);
      color: var(--mark-text);
      padding-inline: 0.05em;
    }

    .search-help {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.45rem 0.9rem;
      border-block-start: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 0.66rem;
    }

    .offline-note {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .offline-dot {
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 0.18rem var(--success-bg);
    }

    .toast {
      position: fixed;
      z-index: 200;
      left: 50%;
      inset-block-end: 1.25rem;
      max-width: min(28rem, calc(100vw - 2rem));
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border-strong);
      border-radius: 0.65rem;
      background: var(--text);
      color: var(--surface);
      box-shadow: var(--shadow-md);
      font-size: 0.8rem;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 0.8rem);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 74rem) {
      .toc-toggle {
        display: inline-flex;
      }

      #toc-close {
        display: inline-flex;
      }

      .toc-panel {
        position: fixed;
        z-index: 60;
        inset-block: var(--header-height) 0;
        inset-inline-start: auto;
        inset-inline-end: 0;
        width: min(var(--toc-width), calc(100vw - 3rem));
        height: auto;
        border-inline-start: 0;
        border-inline-end: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        transform: translateX(-105%);
        transition: transform 160ms ease;
      }

      body.toc-open .toc-panel {
        transform: translateX(0);
      }

      body.toc-open .drawer-overlay {
        display: block;
        opacity: 1;
      }
    }

    @media (max-width: 54rem) {
      .menu-toggle {
        display: inline-flex;
      }

      #docs-close {
        display: inline-flex;
      }

      .app-header {
        gap: 0.45rem;
        padding-inline: 0.65rem;
      }

      .brand {
        min-width: 0;
        flex: 1;
      }

      .brand-mark {
        width: 2.25rem;
        height: 2.25rem;
      }

      .brand-subtitle,
      .header-search {
        display: none;
      }

      .mobile-search {
        display: inline-flex;
      }

      .docs-panel {
        position: fixed;
        z-index: 60;
        inset-block: var(--header-height) 0;
        inset-inline-start: 0;
        width: min(var(--docs-width), calc(100vw - 3rem));
        height: auto;
        border-inline-end: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        transform: translateX(105%);
        transition: transform 160ms ease;
      }

      body.docs-open .docs-panel {
        transform: translateX(0);
      }

      body.docs-open .drawer-overlay {
        display: block;
        opacity: 1;
      }

      body.docs-open,
      body.toc-open {
        overflow: hidden;
      }

      .main-content {
        padding: 1rem 0.7rem 3rem;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .group-grid {
        grid-template-columns: 1fr;
      }

      .project-status-card {
        grid-template-columns: 1fr;
      }

      .document-header,
      .document-body {
        padding-inline: 1rem;
      }

      .heading-anchor {
        position: static;
        margin-inline-start: 0.3rem;
        opacity: 0.7;
      }

      .document-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 35rem) {
      :root {
        --header-height: 3.65rem;
      }

      .header-actions {
        gap: 0.2rem;
      }

      .print-button,
      .theme-label,
      .brand-copy {
        display: none;
      }

      .brand {
        flex: 0 0 auto;
      }

      .dashboard-grid {
        gap: 0.55rem;
      }

      .metric-card {
        padding: 0.75rem;
      }

      .home-hero {
        padding: 1.15rem;
      }

      .continue-row {
        align-items: stretch;
        flex-direction: column;
      }

      .search-dialog {
        width: 100vw;
        max-width: none;
        height: 100dvh;
        max-height: none;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .search-help {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (forced-colors: active) {
      .brand-mark,
      .button-primary,
      .reading-progress-bar,
      .mini-progress > span,
      .offline-dot {
        forced-color-adjust: none;
      }

      .nav-doc-link[aria-current="page"],
      .toc-link[aria-current="location"] {
        outline: 2px solid Highlight;
      }
    }

    @media print {
      @page {
        size: auto;
        margin: 15mm;
      }

      :root,
      :root[data-theme] {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-soft: #f3f4f6;
        --surface-accent: #ffffff;
        --text: #000000;
        --text-soft: #333333;
        --text-faint: #555555;
        --border: #b9b9b9;
        --accent: #000000;
        --danger: #000000;
        --code-bg: #f3f4f6;
        --code-text: #000000;
      }

      body {
        min-width: 0;
        background: #ffffff;
        color: #000000;
        font-size: 10.5pt;
      }

      .skip-link,
      .app-header,
      .reading-progress-track,
      .docs-panel,
      .toc-panel,
      .drawer-overlay,
      .document-actions,
      .heading-anchor,
      .toast,
      .search-dialog,
      .home-view {
        display: none !important;
      }

      .app-layout,
      .main-content,
      .view-shell {
        display: block;
        width: 100%;
        max-width: none;
        min-height: 0;
        margin: 0;
        padding: 0;
      }

      .reading-surface {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .document-header,
      .document-body,
      .document-footer {
        padding-inline: 0;
        background: #ffffff;
      }

      .document-header {

  <script>
    (function () {
      'use strict';

      var STORAGE = {
        theme: 'docs-portal:theme',
        progress: 'docs-portal:progress',
        lastDocument: 'docs-portal:last-document'
      };

      var root = document.documentElement;
      var body = document.body;

      var docsNav = document.getElementById('docs-nav');
      var docsMeta = document.getElementById('docs-meta');
      var tocNav = document.getElementById('toc-nav');
      var tocPanel = document.getElementById('toc-panel');
      var docsPanel = document.getElementById('docs-panel');
      var docsToggle = document.getElementById('docs-toggle');
      var tocToggle = document.getElementById('toc-toggle');
      var printButton = document.getElementById('print-button');
      var progressBar = document.getElementById('reading-progress-bar');
      var searchDialog = document.getElementById('search-dialog');
      var searchInput = document.getElementById('search-input');
      var searchFilters = document.getElementById('search-filters');
      var searchSummary = document.getElementById('search-summary');
      var searchResults = document.getElementById('search-results');
      var toast = document.getElementById('toast');
      var themePicker = document.getElementById('theme-picker');

      var payload;
      var documents = [];
      var groups = [];
      var docsById = new Map();
      var currentDocument = null;
      var currentHeadingId = '';
      var tocObserver = null;
      var scrollFrame = 0;
      var progressSaveTimer = 0;
      var toastTimer = 0;
      var pendingResumeId = '';
      var pendingMainFocus = false;
      var activeSearchGroup = 'all';
      var searchIndex = [];
      var collator = new Intl.Collator('fa', { numeric: true, sensitivity: 'base' });

      function safeStorageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch (error) {
          return null;
        }
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (error) {
          return false;
        }
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatNumber(value) {
        var number = Number(value);
        if (!Number.isFinite(number)) return '۰';
        return new Intl.NumberFormat('fa-IR').format(number);
      }

      function normalizeSearch(value) {
        return String(value == null ? '' : value)
          .normalize('NFKC')
          .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
          .replace(/[يى]/g, 'ی')
          .replace(/ك/g, 'ک')
          .replace(/ة/g, 'ه')
          .replace(/\u0640/g, '')
          .replace(/[\u200C\u200D]/g, ' ')
          .toLocaleLowerCase('fa')
          .replace(/[^\p{L}\p{N}._/\-\s]+/gu, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function normalizePath(value) {
        var input = String(value || '').replace(/\\/g, '/');
        var output = [];
        input.split('/').forEach(function (part) {
          if (!part || part === '.') return;
          if (part === '..') {
            output.pop();
          } else {
            output.push(part);
          }
        });
        return output.join('/');
      }

      function routeFor(documentId, headingId) {
        var route = '#doc/' + encodeURIComponent(documentId);
        if (headingId) route += '/' + encodeURIComponent(headingId);
        return route;
      }

      function parseRoute() {
        var raw = window.location.hash.replace(/^#/, '');
        if (!raw || raw === '/' || raw === 'home') {
          return { type: 'home' };
        }

        var segments = raw.split('/');
        if (segments[0] !== 'doc' || !segments[1]) {
          return { type: 'not-found' };
        }

        try {
          return {
            type: 'document',
            documentId: decodeURIComponent(segments[1]),
            headingId: segments[2] ? decodeURIComponent(segments.slice(2).join('/')) : ''
          };
        } catch (error) {
          return { type: 'not-found' };
        }
      }

      function readProgress() {
        var raw = safeStorageGet(STORAGE.progress);
        if (!raw) return {};
        try {
          var parsed = JSON.parse(raw);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (error) {
          return {};
        }
      }

      function progressFor(documentId) {
        var all = readProgress();
        var value = all[documentId];
        if (!value || typeof value !== 'object') return { ratio: 0, headingId: '' };
        return {
          ratio: Math.min(1, Math.max(0, Number(value.ratio) || 0)),
          headingId: String(value.headingId || '')
        };
      }

      function saveCurrentProgress() {
        if (!currentDocument) return;
        var maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        var ratio = Math.min(1, Math.max(0, window.scrollY / maxScroll));
        var all = readProgress();
        all[currentDocument.id] = {
          ratio: Math.round(ratio * 10000) / 10000,
          headingId: currentHeadingId || ''
        };
        safeStorageSet(STORAGE.progress, JSON.stringify(all));
        safeStorageSet(STORAGE.lastDocument, currentDocument.id);
      }

      function announce(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('visible');
        toastTimer = window.setTimeout(function () {
          toast.classList.remove('visible');
        }, 2400);
      }

      function iconMarkup(name) {
        var icons = {
          search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
          document: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
          source: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg>',
          copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
          arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
        };
        return icons[name] || '';
      }

      function coercePayload(rawPayload) {
        if (!rawPayload || typeof rawPayload !== 'object' || Array.isArray(rawPayload)) {
          throw new Error('ساختار داده مستندات معتبر نیست.');
        }
        if (!rawPayload.meta || Number(rawPayload.meta.schemaVersion) !== 1) {
          throw new Error('نسخه ساختار داده مستندات پشتیبانی نمی‌شود.');
        }
        if (!Array.isArray(rawPayload.docs) || !Array.isArray(rawPayload.groups)) {
          throw new Error('فهرست اسناد یا گروه‌ها در داده تولیدشده وجود ندارد.');
        }

        var normalizedGroups = rawPayload.groups.map(function (group, index) {
          return {
            id: String(group.id || 'other-' + index),
            title: String(group.title || 'سایر'),
            order: Number.isFinite(Number(group.order)) ? Number(group.order) : index,
            count: Number(group.count) || 0
          };
        }).sort(function (a, b) {
          return a.order - b.order || collator.compare(a.title, b.title);
        });

        var groupTitles = new Map(normalizedGroups.map(function (group) {
          return [group.id, group.title];
        }));

        var normalizedDocs = rawPayload.docs.map(function (doc, index) {
          var id = String(doc.id || 'document-' + index);
          var group = String(doc.group || 'other');
          return {
            id: id,
            path: String(doc.path || ''),
            sourceHref: String(doc.sourceHref || ''),
            title: String(doc.title || id),
            summary: String(doc.summary || ''),
            group: group,
            groupTitle: String(doc.groupTitle || groupTitles.get(group) || 'سایر'),
            order: Number.isFinite(Number(doc.order)) ? Number(doc.order) : index,
            lang: String(doc.lang || 'fa'),
            dir: doc.dir === 'ltr' ? 'ltr' : 'rtl',
            lifecycle: doc.lifecycle === 'canonical' || doc.lifecycle === 'legacy' ? doc.lifecycle : '',
            notice: String(doc.notice || ''),
            wordCount: Math.max(0, Number(doc.wordCount) || 0),
            readingMinutes: Math.max(1, Number(doc.readingMinutes) || 1),
            searchText: String(doc.searchText || ''),
            headings: Array.isArray(doc.headings) ? doc.headings.map(function (heading) {
              return {
                id: String(heading.id || ''),
                text: String(heading.text || ''),
                level: Math.min(6, Math.max(1, Number(heading.level) || 2))
              };
            }).filter(function (heading) {
              return heading.id && heading.text;
            }) : [],
            html: String(doc.html || '')
          };
        });

        var seenIds = new Set();
        normalizedDocs.forEach(function (doc) {
          if (seenIds.has(doc.id)) throw new Error('شناسه تکراری سند: ' + doc.id);
          seenIds.add(doc.id);
        });

        normalizedDocs.sort(function (a, b) {
          var groupA = normalizedGroups.find(function (group) { return group.id === a.group; });
          var groupB = normalizedGroups.find(function (group) { return group.id === b.group; });
          var groupOrderA = groupA ? groupA.order : Number.MAX_SAFE_INTEGER;
          var groupOrderB = groupB ? groupB.order : Number.MAX_SAFE_INTEGER;
          return groupOrderA - groupOrderB || a.order - b.order || collator.compare(a.title, b.title);
        });

        return {
          meta: rawPayload.meta,
          groups: normalizedGroups,
          docs: normalizedDocs
        };
      }

      function renderFatal(error) {
        body.dataset.view = 'error';
        printButton.disabled = true;
        tocPanel.hidden = true;
        docsNav.innerHTML = '<div class="empty-state">فهرست اسناد در دسترس نیست.</div>';
        docsMeta.textContent = 'قالب یا خروجی مستندات ناقص است.';
        viewRoot.innerHTML =
          '<section class="fatal-error" role="alert">' +
            '<h1>مستندات بارگذاری نشد</h1>' +
            '<p>این فایل باید توسط ابزار ساخت مستندات تولید شود. اگر فایل خروجی را باز کرده‌اید، دوباره build و stale-check را اجرا کنید.</p>' +
            '<pre class="fatal-details">' + escapeHtml(error && error.message ? error.message : String(error)) + '</pre>' +
          '</section>';
      }

      function buildSearchIndex() {
        searchIndex = documents.map(function (doc) {
          var normalizedHeadings = doc.headings.map(function (heading) {
            return {
              id: heading.id,
              text: heading.text,
              normalized: normalizeSearch(heading.text)
            };
          });
          return {
            doc: doc,
            normalizedTitle: normalizeSearch(doc.title),
            normalizedSummary: normalizeSearch(doc.summary),
            normalizedGroup: normalizeSearch(doc.groupTitle),
            normalizedBody: normalizeSearch(doc.searchText),
            normalizedHeadings: normalizedHeadings,
            haystack: normalizeSearch([
              doc.title,
              doc.summary,
              doc.groupTitle,
              doc.searchText,
              doc.headings.map(function (heading) { return heading.text; }).join(' ')
            ].join(' '))
          };
        });
      }

      function renderDocsNavigation(activeDocumentId) {
        docsNav.textContent = '';

        var homeLink = document.createElement('a');
        homeLink.className = 'nav-home';
        homeLink.href = '#/';
        homeLink.innerHTML = '<span class="nav-home-symbol" aria-hidden="true">⌂</span><span>نمای کلی پروژه</span>';
        if (!activeDocumentId) homeLink.setAttribute('aria-current', 'page');
        docsNav.appendChild(homeLink);

        var renderedGroups = groups.slice();
        var knownGroups = new Set(renderedGroups.map(function (group) { return group.id; }));
        documents.forEach(function (doc) {
          if (!knownGroups.has(doc.group)) {
            knownGroups.add(doc.group);
            renderedGroups.push({ id: doc.group, title: doc.groupTitle || 'سایر', order: Number.MAX_SAFE_INTEGER, count: 0 });
          }
        });

        renderedGroups.forEach(function (group, groupIndex) {
          var groupDocuments = documents.filter(function (doc) { return doc.group === group.id; });
          if (!groupDocuments.length) return;

          var details = document.createElement('details');
          details.className = 'nav-group';
          details.dataset.groupId = group.id;
          if (groupIndex === 0 || groupDocuments.some(function (doc) { return doc.id === activeDocumentId; })) {
            details.open = true;
          }

          var summary = document.createElement('summary');
          var summaryText = document.createElement('span');
          summaryText.textContent = group.title;
          var count = document.createElement('span');
          count.className = 'nav-count';
          count.textContent = formatNumber(groupDocuments.length);
          summary.append(summaryText, count);
          details.appendChild(summary);

          var list = document.createElement('ul');
          list.className = 'nav-doc-list';
          groupDocuments.forEach(function (doc) {
            var item = document.createElement('li');
            var link = document.createElement('a');
            link.className = 'nav-doc-link';
            link.href = routeFor(doc.id);
            link.textContent = doc.title;
            link.dir = 'auto';
            link.dataset.documentId = doc.id;
            if (doc.id === activeDocumentId) link.setAttribute('aria-current', 'page');
            item.appendChild(link);
            list.appendChild(item);
          });
          details.appendChild(list);
          docsNav.appendChild(details);
        });
      }

      function renderMeta() {
        var contentHash = String(payload.meta.contentHash || '').slice(0, 12);
        docsMeta.innerHTML =
          '<strong>' + formatNumber(payload.meta.totalDocs || documents.length) + ' سند</strong>' +
          ' · ' + formatNumber(payload.meta.totalHeadings || 0) + ' بخش' +
          (contentHash ? '<br><span>نسخه محتوا: <bdi class="document-path">' + escapeHtml(contentHash) + '</bdi></span>' : '');
      }

      function renderHome() {
        currentDocument = null;
        currentHeadingId = '';
        body.dataset.view = 'home';
        document.title = 'مرکز مستندات پروژه';
