        var executionPlan = documents.find(function (doc) {
          return /execution[_-]plan/i.test(doc.id) || /EXECUTION_PLAN\.md$/i.test(doc.path);
        }) || documents[0];
        var lastDocumentId = safeStorageGet(STORAGE.lastDocument);
        var lastDocument = lastDocumentId ? docsById.get(lastDocumentId) : null;
        var lastProgress = lastDocument ? progressFor(lastDocument.id) : null;
        var canonicalDocument = documents.find(function (doc) { return doc.lifecycle === 'canonical'; }) || executionPlan;

        var continueMarkup = '';
        if (lastDocument && lastProgress) {
          var percentage = Math.round(lastProgress.ratio * 100);
          continueMarkup =
            '<section class="continue-card" aria-labelledby="continue-title">' +
              '<div class="continue-row">' +
                '<div>' +
                  '<h2 id="continue-title">ادامه مطالعه</h2>' +
                  '<p dir="auto">' + escapeHtml(lastDocument.title) + ' · ' + formatNumber(percentage) + '٪ خوانده‌شده</p>' +
                '</div>' +
                '<a class="button button-primary" href="' + routeFor(lastDocument.id, lastProgress.headingId) + '" data-resume-document="' + escapeHtml(lastDocument.id) + '">' + iconMarkup('arrow') + '<span>ادامه</span></a>' +
              '</div>' +
              '<div class="mini-progress" role="progressbar" aria-label="پیشرفت مطالعه سند" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + percentage + '"><span style="width:' + percentage + '%"></span></div>' +
            '</section>';
        }

        var groupCards = groups.map(function (group) {
          var groupDocuments = documents.filter(function (doc) { return doc.group === group.id; });
          if (!groupDocuments.length) return '';
          var links = groupDocuments.slice(0, 5).map(function (doc) {
            return '<li><a href="' + routeFor(doc.id) + '" dir="auto">' + escapeHtml(doc.title) + '</a></li>';
          }).join('');
          var more = groupDocuments.length > 5
            ? '<li><span class="section-hint">و ' + formatNumber(groupDocuments.length - 5) + ' سند دیگر</span></li>'
            : '';
          return '<article class="group-card">' +
            '<div class="group-card-header"><h3>' + escapeHtml(group.title) + '</h3><span class="group-card-count">' + formatNumber(groupDocuments.length) + '</span></div>' +
            '<ul class="group-docs">' + links + more + '</ul>' +
          '</article>';
        }).join('');

        viewRoot.innerHTML =
          '<div class="home-view">' +
            '<section class="home-hero" aria-labelledby="home-title">' +
              '<span class="home-eyebrow"><span class="offline-dot" aria-hidden="true"></span>همیشه در دسترس و آفلاین</span>' +
              '<h1 id="home-title">نقشه روشن توسعه پروژه</h1>' +
              '<p>این‌جا مرجع خوانای هدف محصول، تصمیم‌ها، معماری، وضعیت کار و بررسی‌های تخصصی پروژه است. فایل‌های Markdown همچنان منبع اصلی حقیقت هستند.</p>' +
              '<div class="home-actions">' +
                (executionPlan ? '<a class="button button-primary" href="' + routeFor(executionPlan.id) + '">' + iconMarkup('document') + '<span>بازکردن سند اجرایی</span></a>' : '') +
                '<button class="button" type="button" data-open-search>' + iconMarkup('search') + '<span>جست‌وجوی اسناد</span></button>' +
              '</div>' +
            '</section>' +

            '<section class="dashboard-grid" aria-label="خلاصه وضعیت کارها">' +
              '<article class="metric-card"><span class="metric-label">انجام‌شده</span><strong class="metric-value success">' + formatNumber(stats.done || 0) + '</strong></article>' +
              '<article class="metric-card"><span class="metric-label">در حال انجام</span><strong class="metric-value warning">' + formatNumber(stats.inProgress || 0) + '</strong></article>' +
              '<article class="metric-card"><span class="metric-label">در انتظار</span><strong class="metric-value info">' + formatNumber(stats.todo || 0) + '</strong></article>' +
              '<article class="metric-card"><span class="metric-label">مسدود</span><strong class="metric-value danger">' + formatNumber(stats.blocked || 0) + '</strong></article>' +
            '</section>' +

            '<section class="project-status-card" aria-labelledby="project-status-title">' +
              '<div>' +
                '<h2 id="project-status-title">وضعیت فعلی پروژه</h2>' +
                '<p><strong>فاز:</strong> <span dir="auto">' + escapeHtml(phase) + '</span></p>' +
                '<p><strong>قدم بعدی:</strong> <span dir="auto">' + escapeHtml(nextTask) + '</span></p>' +
              '</div>' +
              '<span class="meta-chip">' + formatNumber(payload.meta.totalDocs || documents.length) + ' سند · ' + formatNumber(payload.meta.totalWords || 0) + ' واژه</span>' +
            '</section>' +

            '<aside class="lifecycle-overview" aria-label="وضعیت اعتبار مستندات">' +
              '<strong>مرجع زنده پروژه:</strong> فقط <span dir="auto">' + escapeHtml(canonicalDocument ? canonicalDocument.title : 'EXECUTION_PLAN.md') + '</span> canonical است؛ سایر اسناد، snapshotهای قدیمی یا منابع مرجع برای بررسی محصول فعلی هستند.' +
            '</aside>' +

            continueMarkup +

            '<section class="dashboard-section" aria-labelledby="groups-title">' +
              '<div class="section-heading-row"><h2 id="groups-title">دسته‌های مستندات</h2><span class="section-hint">برای شروع، یک سند را انتخاب کنید</span></div>' +
              '<div class="group-grid">' + groupCards + '</div>' +
            '</section>' +
          '</div>';

        window.requestAnimationFrame(function () {
          window.scrollTo({ top: 0, behavior: 'auto' });
        });
      }

      function languageLabel(doc) {
        if (doc.lang === 'en') return 'English';
        if (doc.lang === 'mixed') return 'فارسی + English';
        return 'فارسی';
      }

      function renderDocument(doc, headingId) {
        currentDocument = doc;
        currentHeadingId = headingId || '';
        body.dataset.view = 'document';
        document.title = doc.title + ' — مرکز مستندات';
        printButton.disabled = false;
        tocPanel.hidden = false;
        renderDocsNavigation(doc.id);
        safeStorageSet(STORAGE.lastDocument, doc.id);

        var contentHash = String(payload.meta.contentHash || '').slice(0, 12);
        var lifecycleChip = doc.lifecycle === 'canonical'
          ? '<span class="meta-chip lifecycle-chip-canonical">● مرجع زنده · canonical</span>'
          : doc.lifecycle === 'legacy'
            ? '<span class="meta-chip lifecycle-chip-legacy">◷ snapshot قدیمی · reference</span>'
            : '';
        var noticeMarkup = doc.notice
          ? '<aside class="document-notice' + (doc.lifecycle === 'canonical' ? ' document-notice-canonical' : '') + '" role="note" dir="auto">' + escapeHtml(doc.notice) + '</aside>'
          : '';
        viewRoot.innerHTML =
          '<article class="reading-surface" id="active-document" aria-labelledby="document-title">' +
            '<header class="document-header">' +
              '<nav class="breadcrumbs" aria-label="مسیر سند">' +
                '<a href="#/">نمای کلی</a><span aria-hidden="true">/</span><span>' + escapeHtml(doc.groupTitle) + '</span>' +
              '</nav>' +
              '<h1 class="document-title" id="document-title" dir="auto">' + escapeHtml(doc.title) + '</h1>' +
              (doc.summary ? '<p class="document-summary" dir="auto">' + escapeHtml(doc.summary) + '</p>' : '') +
              '<div class="document-meta" aria-label="مشخصات سند">' +
                lifecycleChip +
                '<span class="meta-chip">' + escapeHtml(doc.groupTitle) + '</span>' +
                '<span class="meta-chip">' + formatNumber(doc.readingMinutes) + ' دقیقه مطالعه</span>' +
                '<span class="meta-chip">' + formatNumber(doc.wordCount) + ' واژه</span>' +
                '<span class="meta-chip">' + escapeHtml(languageLabel(doc)) + '</span>' +
              '</div>' +
              noticeMarkup +
              '<div class="document-actions">' +
                (doc.sourceHref ? '<a class="button" id="open-source" href="' + escapeHtml(doc.sourceHref) + '" target="_blank" rel="noopener">' + iconMarkup('source') + '<span>بازکردن Markdown</span></a>' : '') +
                '<button class="button" type="button" id="copy-path" data-path="' + escapeHtml(doc.path) + '">' + iconMarkup('copy') + '<span>کپی مسیر فایل</span></button>' +
              '</div>' +
            '</header>' +
            '<div class="document-body" id="document-body" dir="' + escapeHtml(doc.dir) + '">' + doc.html + '</div>' +
            '<footer class="document-footer">' +
              '<span>منبع اصلی: <code>' + escapeHtml(doc.path) + '</code></span>' +
              (contentHash ? '<span>نسخه محتوا: <code>' + escapeHtml(contentHash) + '</code></span>' : '') +
            '</footer>' +
          '</article>';

        decorateDocumentBody(doc);
        renderToc(doc);
        observeToc(doc);

        window.requestAnimationFrame(function () {
          var targetHeading = headingId ? document.getElementById(headingId) : null;
          if (targetHeading) {
            targetHeading.scrollIntoView({ block: 'start', behavior: 'auto' });
            setActiveToc(headingId);
          } else if (pendingResumeId === doc.id) {
            var saved = progressFor(doc.id);
            var maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
            window.scrollTo({ top: Math.round(maxScroll * saved.ratio), behavior: 'auto' });
            pendingResumeId = '';
          } else {
            window.scrollTo({ top: 0, behavior: 'auto' });
          }
          updateReadingProgress();
          if (pendingMainFocus) {
            document.getElementById('main-content').focus({ preventScroll: true });
            pendingMainFocus = false;
          }
        });
      }

      function decorateDocumentBody(doc) {
        var container = document.getElementById('document-body');
        if (!container) return;

        var firstSourceHeading = doc.headings.find(function (heading) { return heading.level === 1; });
        var renderedFirstHeading = container.querySelector('h1');
        if (
          firstSourceHeading &&
          renderedFirstHeading &&
          renderedFirstHeading.id === firstSourceHeading.id &&
          normalizeSearch(renderedFirstHeading.textContent) === normalizeSearch(doc.title)
        ) {
          var documentTitle = document.getElementById('document-title');
          var activeDocument = document.getElementById('active-document');
          documentTitle.id = firstSourceHeading.id;
          activeDocument.setAttribute('aria-labelledby', firstSourceHeading.id);
          renderedFirstHeading.remove();
        }

        container.querySelectorAll('p, li, dt, dd, blockquote, figcaption, th, td').forEach(function (element) {
          if (!element.hasAttribute('dir')) element.setAttribute('dir', 'auto');
        });
        container.querySelectorAll('pre, code, samp, kbd').forEach(function (element) {
          element.setAttribute('dir', 'ltr');
        });

        var headingMap = new Map(doc.headings.map(function (heading) { return [heading.id, heading]; }));
        container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (heading, index) {
          if (!heading.id && doc.headings[index]) heading.id = doc.headings[index].id;
          if (!heading.id || heading.querySelector('.heading-anchor')) return;
          var anchor = document.createElement('a');
          anchor.className = 'heading-anchor';
          anchor.href = routeFor(doc.id, heading.id);
          anchor.setAttribute('aria-label', 'پیوند مستقیم به بخش «' + (headingMap.get(heading.id) ? headingMap.get(heading.id).text : heading.textContent.trim()) + '»');
          anchor.textContent = '#';
          heading.appendChild(anchor);
        });

        container.querySelectorAll('table').forEach(function (table) {
          if (table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
          var wrapper = document.createElement('div');
          wrapper.className = 'table-scroll';
          wrapper.setAttribute('role', 'region');
          wrapper.setAttribute('aria-label', 'جدول قابل پیمایش افقی');
          wrapper.tabIndex = 0;
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });

        container.querySelectorAll('a[href]').forEach(function (link) {
          var href = link.getAttribute('href') || '';
          if (/^https?:\/\//i.test(href)) {
            link.classList.add('external-link');
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            if (!link.title) link.title = 'پیوند خارجی؛ بازکردن آن ممکن است به اینترنت نیاز داشته باشد.';
            return;
          }
          rewriteInternalLink(link, href, doc);
        });
      }

      function rewriteInternalLink(link, href, currentDoc) {
        if (!href || /^#doc\//.test(href) || /^(mailto:|tel:|data:)/i.test(href)) return;
        if (href.charAt(0) === '#') {
          var localHeading = decodeURIComponent(href.slice(1));
          if (localHeading) link.href = routeFor(currentDoc.id, localHeading);
          return;
        }

        var hashIndex = href.indexOf('#');
        var filePart = hashIndex >= 0 ? href.slice(0, hashIndex) : href;
        var headingPart = hashIndex >= 0 ? href.slice(hashIndex + 1) : '';
        if (!/\.md$/i.test(filePart)) return;

        var currentDirectory = currentDoc.path.split('/').slice(0, -1).join('/');
        var resolvedPath = normalizePath(currentDirectory + '/' + decodeURIComponent(filePart));
        var targetDoc = documents.find(function (doc) {
          return normalizePath(doc.path).toLocaleLowerCase('en') === resolvedPath.toLocaleLowerCase('en') ||
            normalizePath(doc.sourceHref).toLocaleLowerCase('en') === normalizePath(filePart).toLocaleLowerCase('en');
        });
        if (targetDoc) {
          link.href = routeFor(targetDoc.id, headingPart ? decodeURIComponent(headingPart) : '');
        }
      }

      function renderToc(doc) {
        tocNav.textContent = '';
        var headings = tocHeadingsFor(doc);
        if (!headings.length) {
          tocNav.innerHTML = '<p class="toc-empty">این سند بخش‌بندی داخلی ندارد.</p>';
          return;
        }

        var list = document.createElement('ol');
        list.className = 'toc-list';
        headings.forEach(function (heading) {
          var item = document.createElement('li');
          var link = document.createElement('a');
          link.className = 'toc-link';
          link.dataset.headingId = heading.id;
          link.dataset.level = String(heading.level);
          link.href = routeFor(doc.id, heading.id);
          link.textContent = heading.text;
          link.dir = 'auto';
          if (heading.id === currentHeadingId) link.setAttribute('aria-current', 'location');
          item.appendChild(link);
          list.appendChild(item);
        });
        tocNav.appendChild(list);
      }

      function disconnectTocObserver() {
        if (tocObserver) {
          tocObserver.disconnect();
          tocObserver = null;
        }
      }

      function tocHeadingsFor(doc) {
        var titleHeading = doc.headings.find(function (heading) {
          return heading.level === 1 && normalizeSearch(heading.text) === normalizeSearch(doc.title);
        });
        return titleHeading
          ? doc.headings.filter(function (heading) { return heading.id !== titleHeading.id; })
          : doc.headings.slice();
      }

      function observeToc(doc) {
        disconnectTocObserver();
        var headings = tocHeadingsFor(doc);
        if (!('IntersectionObserver' in window) || !headings.length) return;
        var visibleHeadings = new Map();
        tocObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              visibleHeadings.set(entry.target.id, entry.boundingClientRect.top);
            } else {
              visibleHeadings.delete(entry.target.id);
            }
          });
          if (visibleHeadings.size) {
            var closest = Array.from(visibleHeadings.entries()).sort(function (a, b) {
              return Math.abs(a[1]) - Math.abs(b[1]);
            })[0];
            setActiveToc(closest[0]);
          }
        }, { rootMargin: '-15% 0px -70% 0px', threshold: [0, 1] });

        headings.forEach(function (heading) {
          var element = document.getElementById(heading.id);
          if (element) tocObserver.observe(element);
        });
      }

      function setActiveToc(headingId) {
        if (!headingId) return;
        currentHeadingId = headingId;
        tocNav.querySelectorAll('.toc-link').forEach(function (link) {
          if (link.dataset.headingId === headingId) {
            link.setAttribute('aria-current', 'location');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      }

      function renderNotFound() {
        currentDocument = null;
        currentHeadingId = '';
        body.dataset.view = 'not-found';
        document.title = 'سند پیدا نشد — مرکز مستندات';
        printButton.disabled = true;
        tocPanel.hidden = true;
        progressBar.style.width = '0%';
        disconnectTocObserver();
        renderDocsNavigation('');
        viewRoot.innerHTML =
          '<section class="not-found" role="alert">' +
            '<h1>این سند پیدا نشد</h1>' +
            '<p>ممکن است آدرس قدیمی باشد یا نام سند تغییر کرده باشد.</p>' +
            '<a class="button button-primary" href="#/">بازگشت به نمای کلی</a>' +
          '</section>';
        window.requestAnimationFrame(function () {
          window.scrollTo({ top: 0, behavior: 'auto' });
        });
      }

      function renderRoute() {
        saveCurrentProgress();
        closeDrawers();
        var route = parseRoute();
        if (route.type === 'home') {
          renderHome();
          if (pendingMainFocus) {
            document.getElementById('main-content').focus({ preventScroll: true });
            pendingMainFocus = false;
          }
          return;
        }
        if (route.type === 'document') {
          var doc = docsById.get(route.documentId);
          if (doc) {
            renderDocument(doc, route.headingId);
            return;
          }
        }
        renderNotFound();
      }

      function updateReadingProgress() {
        if (!currentDocument) {
          progressBar.style.width = '0%';
          return;
        }
        var maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        var ratio = Math.min(1, Math.max(0, window.scrollY / maxScroll));
        progressBar.style.width = (ratio * 100).toFixed(2) + '%';
      }

      function onScroll() {
        if (scrollFrame) return;
        scrollFrame = window.requestAnimationFrame(function () {
          scrollFrame = 0;
          updateReadingProgress();
          window.clearTimeout(progressSaveTimer);
          progressSaveTimer = window.setTimeout(saveCurrentProgress, 240);
        });
      }

      function openDrawer(name) {
        var docsOpen = name === 'docs';
        var tocOpen = name === 'toc';
        body.classList.toggle('docs-open', docsOpen);
        body.classList.toggle('toc-open', tocOpen);
        docsToggle.setAttribute('aria-expanded', docsOpen ? 'true' : 'false');
        tocToggle.setAttribute('aria-expanded', tocOpen ? 'true' : 'false');
        if (docsOpen) document.getElementById('docs-close').focus({ preventScroll: true });
        if (tocOpen) document.getElementById('toc-close').focus({ preventScroll: true });
      }

      function closeDrawers() {
        body.classList.remove('docs-open', 'toc-open');
        docsToggle.setAttribute('aria-expanded', 'false');
        tocToggle.setAttribute('aria-expanded', 'false');
      }

      function currentTheme() {
        var value = root.getAttribute('data-theme');
        return value === 'light' || value === 'dark' ? value : 'system';
      }

      function applyTheme(theme) {
        var selected = theme === 'light' || theme === 'dark' ? theme : 'system';
        root.setAttribute('data-theme', selected);
        safeStorageSet(STORAGE.theme, selected);
        document.querySelectorAll('[data-theme-choice]').forEach(function (button) {
          button.setAttribute('aria-pressed', button.dataset.themeChoice === selected ? 'true' : 'false');
        });
      }

      function openSearch() {
        closeDrawers();
        if (typeof searchDialog.showModal === 'function') {
          if (!searchDialog.open) searchDialog.showModal();
        } else {
          searchDialog.setAttribute('open', '');
        }
        window.setTimeout(function () {
          searchInput.focus();
          searchInput.select();
        }, 0);
        runSearch();
      }

      function closeSearch() {
        if (typeof searchDialog.close === 'function' && searchDialog.open) {
          searchDialog.close();
        } else {
          searchDialog.removeAttribute('open');
        }
      }

      function renderSearchFilters() {
        searchFilters.textContent = '';
        var allButton = document.createElement('button');
        allButton.type = 'button';
        allButton.className = 'filter-chip';
        allButton.dataset.searchGroup = 'all';
        allButton.setAttribute('aria-pressed', 'true');
        allButton.textContent = 'همه اسناد';
        searchFilters.appendChild(allButton);

        groups.forEach(function (group) {
          if (!documents.some(function (doc) { return doc.group === group.id; })) return;
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'filter-chip';
          button.dataset.searchGroup = group.id;
          button.setAttribute('aria-pressed', 'false');
          button.textContent = group.title;
          searchFilters.appendChild(button);
        });
      }

      function scoreSearchEntry(entry, tokens, phrase) {
        if (!tokens.every(function (token) { return entry.haystack.indexOf(token) >= 0; })) return null;
        var score = 0;
        var bestHeading = null;
        if (phrase && entry.normalizedTitle.indexOf(phrase) >= 0) score += 120;
        if (phrase && entry.normalizedSummary.indexOf(phrase) >= 0) score += 32;
        tokens.forEach(function (token) {
          if (entry.normalizedTitle.indexOf(token) >= 0) score += 34;
          if (entry.normalizedSummary.indexOf(token) >= 0) score += 10;
          if (entry.normalizedGroup.indexOf(token) >= 0) score += 5;
          var heading = entry.normalizedHeadings.find(function (candidate) {
            return candidate.normalized.indexOf(token) >= 0;
          });
          if (heading) {
            score += 18;
            if (!bestHeading) bestHeading = heading;
          }
          if (entry.normalizedBody.indexOf(token) >= 0) score += 2;
        });
        return { entry: entry, score: score, heading: bestHeading };
      }

      function makeSnippet(text, tokens) {
        var source = String(text || '').replace(/\s+/g, ' ').trim();
        if (!source) return '';
        var normalized = normalizeSearch(source);
        var index = -1;
        tokens.some(function (token) {
          index = normalized.indexOf(token);
          return index >= 0;
        });
        var start = Math.max(0, index >= 0 ? index - 70 : 0);
        var end = Math.min(source.length, start + 220);
        var slice = source.slice(start, end);
        if (start > 0) slice = '…' + slice;
        if (end < source.length) slice += '…';
        return slice;
      }

      function appendHighlightedText(container, text, tokens) {
        String(text || '').split(/(\s+)/).forEach(function (part) {
          if (!part) return;
          var normalized = normalizeSearch(part);
          var matched = normalized && tokens.some(function (token) {
            return normalized.indexOf(token) >= 0;
          });
          var node = document.createElement(matched ? 'mark' : 'span');
          node.textContent = part;
          container.appendChild(node);
        });
      }

      function runSearch() {
        var rawQuery = searchInput.value.trim();
        var phrase = normalizeSearch(rawQuery);
        var tokens = phrase.split(' ').filter(Boolean);
        var candidates;

        if (!tokens.length) {
          candidates = searchIndex
            .filter(function (entry) { return activeSearchGroup === 'all' || entry.doc.group === activeSearchGroup; })
            .slice(0, 12)
            .map(function (entry) { return { entry: entry, score: 0, heading: null }; });
          searchSummary.textContent = 'برای جست‌وجوی دقیق‌تر، یک یا چند واژه بنویسید.';
        } else {
          candidates = searchIndex
            .filter(function (entry) { return activeSearchGroup === 'all' || entry.doc.group === activeSearchGroup; })
            .map(function (entry) { return scoreSearchEntry(entry, tokens, phrase); })
            .filter(Boolean)
            .sort(function (a, b) { return b.score - a.score || collator.compare(a.entry.doc.title, b.entry.doc.title); })
            .slice(0, 50);
          searchSummary.textContent = candidates.length
            ? formatNumber(candidates.length) + ' نتیجه برای «' + rawQuery + '»'
            : 'نتیجه‌ای برای «' + rawQuery + '» پیدا نشد.';
        }

        searchResults.textContent = '';
        if (!candidates.length) {
          var empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.textContent = 'املای عبارت یا گروه انتخاب‌شده را بررسی کنید.';
          searchResults.appendChild(empty);
          return;
        }

        candidates.forEach(function (result) {
          var doc = result.entry.doc;
          var item = document.createElement('li');
          var link = document.createElement('a');
          link.className = 'search-result-link';
          link.href = routeFor(doc.id, result.heading ? result.heading.id : '');
          link.innerHTML = '<span class="search-result-icon">' + iconMarkup('document') + '</span>';

          var main = document.createElement('span');
          main.className = 'search-result-main';
          var titleRow = document.createElement('span');
          titleRow.className = 'search-result-title-row';
          var title = document.createElement('span');
          title.className = 'search-result-title';
          title.dir = 'auto';
          appendHighlightedText(title, doc.title, tokens);
          var group = document.createElement('span');
          group.className = 'search-result-group';
          group.textContent = doc.groupTitle;
          titleRow.append(title, group);
          main.appendChild(titleRow);

          if (result.heading) {
            var heading = document.createElement('span');
            heading.className = 'search-result-heading';
            heading.dir = 'auto';
            appendHighlightedText(heading, result.heading.text, tokens);
            main.appendChild(heading);
          }

          var snippet = document.createElement('span');
          snippet.className = 'search-result-snippet';
          snippet.dir = 'auto';
          appendHighlightedText(snippet, makeSnippet(doc.searchText || doc.summary, tokens), tokens);
          main.appendChild(snippet);
          link.appendChild(main);
          item.appendChild(link);
          searchResults.appendChild(item);
        });
      }

      function copyText(text) {
        var value = String(text || '');
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          return navigator.clipboard.writeText(value).catch(function () {
            return fallbackCopy(value);
          });
        }
        return fallbackCopy(value);
      }

      function fallbackCopy(value) {
        return new Promise(function (resolve, reject) {
          var textarea = document.createElement('textarea');
          textarea.value = value;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            var successful = document.execCommand('copy');
            document.body.removeChild(textarea);
            if (successful) resolve(); else reject(new Error('copy failed'));
          } catch (error) {
            document.body.removeChild(textarea);
            reject(error);
          }
        });
      }

      function isTypingTarget(target) {
        if (!(target instanceof Element)) return false;
        return target.matches('input, textarea, select, [contenteditable="true"]');
      }

      function initializeEvents() {
        window.addEventListener('hashchange', renderRoute);
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', updateReadingProgress, { passive: true });
        window.addEventListener('beforeunload', saveCurrentProgress);

        document.getElementById('skip-link').addEventListener('click', function (event) {
          event.preventDefault();
          document.getElementById('main-content').focus();
        });

        docsToggle.addEventListener('click', function () { openDrawer(body.classList.contains('docs-open') ? '' : 'docs'); });
        tocToggle.addEventListener('click', function () { openDrawer(body.classList.contains('toc-open') ? '' : 'toc'); });
        document.getElementById('docs-close').addEventListener('click', closeDrawers);
        document.getElementById('toc-close').addEventListener('click', closeDrawers);
        document.getElementById('drawer-overlay').addEventListener('click', closeDrawers);

        document.getElementById('search-open').addEventListener('click', openSearch);
        document.getElementById('mobile-search-open').addEventListener('click', openSearch);
        document.getElementById('search-close').addEventListener('click', closeSearch);
        searchInput.addEventListener('input', runSearch);
        searchInput.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter') return;
          var firstResult = searchResults.querySelector('.search-result-link');
          if (!firstResult) return;
          event.preventDefault();
          pendingMainFocus = true;
          firstResult.click();
        });

        searchFilters.addEventListener('click', function (event) {
          var button = event.target.closest('[data-search-group]');
          if (!button) return;
          activeSearchGroup = button.dataset.searchGroup;
          searchFilters.querySelectorAll('[data-search-group]').forEach(function (candidate) {
            candidate.setAttribute('aria-pressed', candidate === button ? 'true' : 'false');
          });
          runSearch();
        });

        searchResults.addEventListener('click', function (event) {
          var link = event.target.closest('a[href^="#doc/"]');
          if (!link) return;
          pendingMainFocus = true;
          closeSearch();
        });

        searchDialog.addEventListener('click', function (event) {
          if (event.target === searchDialog) closeSearch();
        });

        searchDialog.addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
          var links = Array.from(searchResults.querySelectorAll('.search-result-link'));
          if (!links.length) return;
          event.preventDefault();
          var currentIndex = links.indexOf(document.activeElement);
          var direction = event.key === 'ArrowDown' ? 1 : -1;
          var nextIndex = currentIndex < 0 ? (direction > 0 ? 0 : links.length - 1) : (currentIndex + direction + links.length) % links.length;
          links[nextIndex].focus();
        });

        document.addEventListener('keydown', function (event) {
          if ((event.ctrlKey || event.metaKey) && event.key.toLocaleLowerCase('en') === 'k') {
            event.preventDefault();
            openSearch();
            return;
          }
          if (event.key === '/' && !isTypingTarget(event.target) && !searchDialog.open) {
            event.preventDefault();
            openSearch();
            return;
          }
          if (event.key === 'Escape') {
            closeDrawers();
            if (searchDialog.open) closeSearch();
            if (themePicker.open) themePicker.open = false;
          }
        });

        document.querySelectorAll('[data-theme-choice]').forEach(function (button) {
          button.addEventListener('click', function () {
            applyTheme(button.dataset.themeChoice);
            themePicker.open = false;
          });
        });

        document.addEventListener('click', function (event) {
          if (themePicker.open && !themePicker.contains(event.target)) themePicker.open = false;

          var routeLink = event.target.closest('a[href^="#doc/"], a[href="#/"]');
          if (routeLink) {
            pendingMainFocus = Boolean(event.target.closest('.search-results'));
            closeDrawers();
          }

          var resumeLink = event.target.closest('[data-resume-document]');
          if (resumeLink) pendingResumeId = resumeLink.dataset.resumeDocument;

          var openSearchButton = event.target.closest('[data-open-search]');
          if (openSearchButton) {
            event.preventDefault();
            openSearch();
          }

          var copyButton = event.target.closest('#copy-path');
          if (copyButton) {
            copyText(copyButton.dataset.path).then(function () {
              announce('مسیر فایل کپی شد.');
            }).catch(function () {
              announce('کپی خودکار ممکن نبود؛ مسیر را از پایین سند بردارید.');
            });
          }
        });

        printButton.addEventListener('click', function () {
          if (currentDocument) window.print();
        });
      }

      try {
        var dataElement = document.getElementById('docs-data');
        var rawData = dataElement.textContent.trim();
        payload = coercePayload(JSON.parse(rawData));
        documents = payload.docs;
        groups = payload.groups;
        docsById = new Map(documents.map(function (doc) { return [doc.id, doc]; }));
        buildSearchIndex();
        renderMeta();
        renderSearchFilters();
        applyTheme(currentTheme());
        initializeEvents();
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        renderRoute();
      } catch (error) {
        renderFatal(error);
      }
    }());
  </script>
</body>
</html>
